name: Release Ait

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to release (for example v0.0.7)
        required: true
        type: string
      source_commit:
        description: Optional full commit SHA for an explicitly requested same-version rebuild
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android
    uses: ./.github/workflows/release-android.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      source_commit: ${{ inputs.source_commit || '' }}

  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            platform: linux
            artifact: ait-linux-x64
          - label: Apple Silicon
            runner: macos-15
            rust_target: aarch64-apple-darwin
            platform: mac
            artifact: ait-macos-arm64
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CARGO_TERM_COLOR: always
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      AIT_DESKTOP_SMOKE: "1"
      # Old immutable tags still use the former name in their packaging hooks.
      PASEO_DESKTOP_SMOKE: "1"
    steps:
      - name: Validate rebuild source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          if [ -n "$SOURCE_COMMIT" ]; then
            [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          fi

      - name: Check out release source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_commit || inputs.tag || github.ref }}

      - name: Check out release tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .tmp/release-tools

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.rust_target }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify release version
        run: node scripts/verify-release-version.mjs "$RELEASE_TAG"

      - name: Install workspace dependencies
        run: npm ci

      - name: Validate release tooling
        run: node --test .tmp/release-tools/scripts/release-assets.test.mjs .tmp/release-tools/scripts/release-layout.test.mjs .tmp/release-tools/scripts/prepare-desktop-daemon.test.mjs .tmp/release-tools/scripts/verify-packaged-resources.test.cjs

      - name: Install Linux packaging and smoke-test dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse2 xvfb libgtk-3-0 libnss3 libasound2t64
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Resolve release source layout
        id: layout
        run: node .tmp/release-tools/scripts/release-layout.mjs

      - name: Build release daemon only
        run: cargo build --locked --release -p "${{ steps.layout.outputs.package }}" --bin "${{ steps.layout.outputs.binary }}" --target "${{ matrix.rust_target }}"

      - name: Package Linux desktop
        if: matrix.platform == 'linux'
        env:
          AIT_SERVER_BIN: ${{ github.workspace }}/target/${{ matrix.rust_target }}/release/${{ steps.layout.outputs.binary }}
        run: npm run package:linux

      - name: Validate Apple signing secrets
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_BUILD_APP_SECRET }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"

      - name: Package, sign, and notarize macOS desktop
        if: matrix.platform == 'mac'
        env:
          AIT_SERVER_BIN: ${{ github.workspace }}/target/${{ matrix.rust_target }}/release/${{ steps.layout.outputs.binary }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_BUILD_APP_SECRET }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package:mac

      - name: Collect installers and updater assets
        run: node .tmp/release-tools/scripts/release-assets.mjs collect "${{ matrix.platform }}" "${RELEASE_TAG#v}" "${{ steps.layout.outputs.desktop }}/release" release-assets

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_commit || inputs.tag || github.ref }}
      - name: Check out release tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .tmp/release-tools
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v7
        with:
          pattern: ait-*
          path: release-assets
          merge-multiple: true

      - name: Record release build source
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { writeFileSync } = require('node:fs');
          const info = {
            version: process.env.RELEASE_TAG.replace(/^v/, ''),
            releaseTag: process.env.RELEASE_TAG,
            sourceCommit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            workflowCommit: process.env.GITHUB_WORKFLOW_SHA,
            workflowRunUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          };
          writeFileSync('release-assets/BUILD-INFO.json', JSON.stringify(info, null, 2) + '\n');
          NODE

      - name: Verify assets and write checksums
        run: node .tmp/release-tools/scripts/release-assets.mjs verify "${RELEASE_TAG#v}" release-assets

      - name: Create or repair GitHub Release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --generate-notes \
              --title "Ait ${RELEASE_TAG}" \
              --verify-tag \
              --repo "$GITHUB_REPOSITORY"
          fi
