name: Release Ait

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v0.0.14)
        required: true
        type: string
      source_commit:
        description: Optional full commit SHA for an explicitly requested same-version rebuild
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # Every build job checks out this ref; release tooling always comes from the workflow commit.
  SOURCE_REF: ${{ inputs.source_commit || inputs.tag || github.ref }}
  SOURCE_COMMIT: ${{ inputs.source_commit }}

jobs:
  # Windows ships without a daemon, so it needs neither Rust nor the release tooling checkout.
  windows:
    name: Build Windows x64
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - &validate-source
        name: Validate rebuild source
        if: env.SOURCE_COMMIT != ''
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]

      - &checkout-source
        name: Check out release source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}

      - &setup-node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - &verify-version
        name: Verify release version
        run: node scripts/verify-release-version.mjs "$RELEASE_TAG"

      - run: npm ci

      - name: Build Windows desktop without daemon
        run: npm run build:windows

      - name: Smoke packaged Windows desktop
        run: node apps/desktop/e2e/windows-startup.e2e.mjs

      - name: Collect installers and updater assets
        run: node scripts/release-assets.mjs collect win "${RELEASE_TAG#v}" apps/desktop/release release-assets

      - name: Record Windows build source
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { writeFileSync } = require('node:fs');
          const info = {
            version: process.env.RELEASE_TAG.replace(/^v/, ''),
            releaseTag: process.env.RELEASE_TAG,
            sourceCommit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            workflowCommit: process.env.GITHUB_WORKFLOW_SHA,
            workflowRunUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            platform: 'win32',
            arch: 'x64',
            bundledDaemon: false,
          };
          writeFileSync('release-assets/BUILD-INFO-windows.json', JSON.stringify(info, null, 2) + '\n');
          NODE

      - uses: actions/upload-artifact@v6
        with:
          name: ait-windows-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  # ADR-188: the hosted browser client image is deployed at the site root by ait-server.
  web-client:
    name: Publish web client image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/ait-app/ait-web-client
    steps:
      - *validate-source
      - *checkout-source
      - *setup-node
      - *verify-version
      - run: npm ci

      - name: Build and check web client image
        run: |
          npm run build:web-console --workspace=@ait/mobile
          source_commit=$(git rev-parse HEAD)
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$source_commit" \
            --label "org.opencontainers.image.version=${RELEASE_TAG#v}" \
            --tag "$IMAGE:$RELEASE_TAG" \
            --tag "$IMAGE:sha-$source_commit" \
            apps/mobile/web-console
          docker run --rm --detach --publish 127.0.0.1:8080:80 "$IMAGE:$RELEASE_TAG"
          bash apps/mobile/web-console/check-routes.sh http://127.0.0.1:8080

      - name: Publish image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          source_commit=$(git rev-parse HEAD)
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$RELEASE_TAG"
          docker push "$IMAGE:sha-$source_commit"

  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            platform: linux
            artifact: ait-linux-x64
          - label: Apple Silicon
            runner: macos-15
            rust_target: aarch64-apple-darwin
            platform: mac
            artifact: ait-macos-arm64
    env:
      CARGO_TERM_COLOR: always
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      AIT_DESKTOP_SMOKE: "1"
      # Old immutable tags still use the former name in their packaging hooks.
      PASEO_DESKTOP_SMOKE: "1"
    steps:
      - *validate-source
      - *checkout-source

      - &checkout-tooling
        name: Check out release tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .tmp/release-tools

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.rust_target }}

      - *setup-node
      - *verify-version
      - run: npm ci

      - name: Validate release tooling
        run: node --test .tmp/release-tools/scripts/release-assets.test.mjs .tmp/release-tools/scripts/release-layout.test.mjs .tmp/release-tools/scripts/release-workflow.test.mjs .tmp/release-tools/scripts/prepare-desktop-daemon.test.mjs .tmp/release-tools/scripts/verify-packaged-resources.test.cjs

      - name: Install Linux packaging and smoke-test dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse2 xvfb libgtk-3-0 libnss3 libasound2t64 rpm
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Resolve release source layout
        id: layout
        run: node .tmp/release-tools/scripts/release-layout.mjs

      - name: Build release daemon only
        if: matrix.platform == 'mac'
        run: cargo build --locked --release -p "${{ steps.layout.outputs.package }}" --bin "${{ steps.layout.outputs.binary }}" --target "${{ matrix.rust_target }}"

      # Desktop and standalone archives share this daemon; manylinux_2_28 keeps it on glibc 2.28+.
      - name: Build release daemon only (glibc 2.28 baseline)
        if: matrix.platform == 'linux'
        run: bash .tmp/release-tools/scripts/build-linux-daemon.sh "${{ steps.layout.outputs.package }}" "${{ steps.layout.outputs.binary }}" "${{ matrix.rust_target }}" 1.98.1

      - name: Package Linux desktop
        if: matrix.platform == 'linux'
        env:
          AITD_BIN: ${{ github.workspace }}/target/${{ matrix.rust_target }}/release/${{ steps.layout.outputs.binary }}
          # Old immutable tags rebuilt from this workflow still read the former name.
          AIT_SERVER_BIN: ${{ github.workspace }}/target/${{ matrix.rust_target }}/release/${{ steps.layout.outputs.binary }}
        run: npm run package:linux

      - name: Package, sign, and notarize macOS desktop
        if: matrix.platform == 'mac'
        env:
          AITD_BIN: ${{ github.workspace }}/target/${{ matrix.rust_target }}/release/${{ steps.layout.outputs.binary }}
          # Old immutable tags rebuilt from this workflow still read the former name.
          AIT_SERVER_BIN: ${{ github.workspace }}/target/${{ matrix.rust_target }}/release/${{ steps.layout.outputs.binary }}
          # The web bundle peaks near 2.7 GB; Node's default heap on the 7 GB macOS runner is too small.
          NODE_OPTIONS: --max-old-space-size=4096
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_BUILD_APP_SECRET }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Apple signing secret for $name is not configured"
              exit 1
            fi
          done
          npm run package:mac

      - name: Collect installers and updater assets
        run: node .tmp/release-tools/scripts/release-assets.mjs collect "${{ matrix.platform }}" "${RELEASE_TAG#v}" "${{ steps.layout.outputs.desktop }}/release" release-assets

      # Restrict user namespaces so the installed packages must fall back to their SUID helper.
      - name: Smoke installed deb and rpm packages
        if: matrix.platform == 'linux'
        working-directory: ${{ steps.layout.outputs.desktop }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          sudo apt-get install -y ./release/*.deb
          node e2e/linux-artifact-smoke.js
          sudo dpkg --remove ait-desktop
          # Ubuntu names runtime libraries the Debian way; rpm still installs the real payload and scriptlets.
          sudo rpm --install --nodeps release/*.rpm
          node e2e/linux-artifact-smoke.js

      # The desktop bundle signs its own copy; this signs the standalone headless daemon.
      - name: Sign and notarize standalone macOS daemon
        if: matrix.platform == 'mac'
        env:
          DAEMON_BIN: ${{ github.workspace }}/target/${{ matrix.rust_target }}/release/${{ steps.layout.outputs.binary }}
          ENTITLEMENTS: ${{ steps.layout.outputs.desktop }}/build/entitlements.mac.inherit.plist
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_BUILD_APP_SECRET }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/standalone-daemon"
          keychain="$RUNNER_TEMP/aitd-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          mkdir -p "$work/bin"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -f "$work/certificate.p12"' EXIT
          if [ -f "$CSC_LINK" ]; then
            cp "$CSC_LINK" "$work/certificate.p12"
          else
            printf '%s' "$CSC_LINK" | base64 -d > "$work/certificate.p12"
          fi
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$work/certificate.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          test -n "$identity"
          cp "$DAEMON_BIN" "$work/bin/aitd"
          codesign --force --timestamp --options runtime --entitlements "$ENTITLEMENTS" \
            --keychain "$keychain" --sign "$identity" "$work/bin/aitd"
          codesign --verify --strict --verbose=2 "$work/bin/aitd"
          ditto -c -k --keepParent "$work/bin/aitd" "$work/aitd.zip"
          xcrun notarytool submit "$work/aitd.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m --output-format json > "$work/notarization.json"
          status=$(plutil -extract status raw -o - "$work/notarization.json")
          if [ "$status" != "Accepted" ]; then
            id=$(plutil -extract id raw -o - "$work/notarization.json")
            xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
            echo "Standalone daemon notarization status: $status" >&2
            exit 1
          fi
          echo "STANDALONE_DAEMON_BIN=$work/bin/aitd" >> "$GITHUB_ENV"

      - name: Package standalone daemon
        env:
          DAEMON_BIN: ${{ env.STANDALONE_DAEMON_BIN || format('{0}/target/{1}/release/{2}', github.workspace, matrix.rust_target, steps.layout.outputs.binary) }}
        run: node .tmp/release-tools/scripts/release-assets.mjs daemon "${{ matrix.platform }}" "${RELEASE_TAG#v}" "$DAEMON_BIN" release-assets

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  # ADR-234: every stable tag goes to Play internal testing. The job is outside the GitHub Release's
  # needs and its failure does not fail the run, because ait-release stops on an unsuccessful run.
  android-play:
    name: Release Android to Google Play internal testing
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      version: ${{ steps.plan.outputs.version }}
      version_code: ${{ steps.plan.outputs.version_code }}
      submitted: ${{ steps.submit.outcome }}
    # Serialize uploads across tags; each run and retry gets its own versionCode.
    # The default queue would cancel a tag's pending upload when a newer tag arrives.
    concurrency:
      group: release-android-play
      cancel-in-progress: false
      queue: max
    env:
      VERSION_CODE_BASE: ${{ vars.ANDROID_PLAY_VERSION_CODE_BASE || '0' }}
      APP_VARIANT: production
      AIT_ANDROID_HERMES_O0: "1"
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    steps:
      - *validate-source

      - name: Validate release request and credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [[ "$RELEASE_TAG" == *$'\n'* ]] || ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a stable release tag vX.Y.Z"
            exit 1
          fi
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::All four ANDROID_KEYSTORE/KEY signing secrets are required"
              exit 1
            fi
          done
          # Without google-services.json the app builds fine but never gets an FCM token.
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::ANDROID_GOOGLE_SERVICES_JSON is required for Android push notifications"
            exit 1
          fi
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is required to upload to Play"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/android-play.keystore"
          test -s "$RUNNER_TEMP/android-play.keystore"
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services.json"
          echo "GOOGLE_SERVICES_FILE_PROD=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"

      - name: Check out release source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      # Four React Native ABIs outgrow the default runner disk.
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/share/swift

      - *setup-node

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - *verify-version

      - name: Install workspace dependencies
        run: npm ci

      - name: Build shared UI dependencies
        run: npm run build:ui-deps

      - name: Check out release tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .tmp/android-play-release-tools
          persist-credentials: false

      - name: Move tooling outside the Metro source tree
        run: mv .tmp/android-play-release-tools "$RUNNER_TEMP/android-play-release-tools"

      - name: Plan Play build and versionCode
        id: plan
        run: |
          export SOURCE_COMMIT=$(git rev-parse HEAD)
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const { planAndroidPlayRelease } = await import(pathToFileURL(
            `${process.env.RUNNER_TEMP}/android-play-release-tools/scripts/android-play-release.mjs`));
          const plan = planAndroidPlayRelease({
            tag: process.env.RELEASE_TAG,
            version: JSON.parse(readFileSync('apps/mobile/package.json', 'utf8')).version,
            sourceCommit: process.env.SOURCE_COMMIT,
            runNumber: process.env.GITHUB_RUN_NUMBER,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            versionCodeBase: process.env.VERSION_CODE_BASE,
          });
          writeFileSync(`${process.env.RUNNER_TEMP}/android-play-plan.json`, JSON.stringify(plan));
          appendFileSync(process.env.GITHUB_OUTPUT,
            `version=${plan.version}\nversion_code=${plan.versionCode}\nbundle_name=${plan.bundleName}\nsource_commit=${plan.sourceCommit}\n`);
          NODE

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx --no-install expo prebuild --platform android --clean --non-interactive

      - name: Verify R8 and FCM configuration and set Gradle versionCode
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const {
            configureAndroidPlayGradle,
            validateAndroidPlayGoogleServices,
            validateAndroidPlayOptimization,
          } = await import(pathToFileURL(
            `${process.env.RUNNER_TEMP}/android-play-release-tools/scripts/android-play-release.mjs`));
          const plan = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/android-play-plan.json`, 'utf8'));
          const file = 'apps/mobile/android/app/build.gradle';
          const gradle = readFileSync(file, 'utf8');
          validateAndroidPlayOptimization(gradle, readFileSync('apps/mobile/android/gradle.properties', 'utf8'));
          validateAndroidPlayGoogleServices(
            readFileSync('apps/mobile/android/app/google-services.json', 'utf8'), gradle, plan.packageId);
          writeFileSync(file, configureAndroidPlayGradle(gradle, plan.versionCode));
          NODE

      - name: Build signed AAB with Gradle
        working-directory: apps/mobile/android
        timeout-minutes: 120
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:bundleRelease \
            -x lint -x lintVitalAnalyzeRelease -x lintVitalRelease \
            -x generateReleaseLintModel -x generateReleaseLintVitalModel \
            "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/android-play.keystore" \
            "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"

      - name: Download pinned bundletool
        run: |
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$RUNNER_TEMP/bundletool.jar"
          printf '%s  %s\n' a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29 \
            "$RUNNER_TEMP/bundletool.jar" | sha256sum --check

      - name: Verify and collect signed AAB
        run: |
          node "$RUNNER_TEMP/android-play-release-tools/scripts/android-play-release.mjs" \
            --bundle apps/mobile/android/app/build/outputs/bundle/release/app-release.aab \
            --bundletool "$RUNNER_TEMP/bundletool.jar" \
            --plan "$RUNNER_TEMP/android-play-plan.json" --output-dir release-assets-play

      - uses: actions/upload-artifact@v6
        with:
          # Must not match the GitHub Release job's ait-* download pattern.
          name: android-play-aab
          path: release-assets-play/*
          if-no-files-found: error
          retention-days: 14

      - name: Submit this verified AAB to Google Play
        id: submit
        uses: r0adkll/upload-google-play@v1
        timeout-minutes: 30
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.ait.mobile
          releaseFiles: release-assets-play/${{ steps.plan.outputs.bundle_name }}
          releaseName: ${{ steps.plan.outputs.version }} (${{ steps.plan.outputs.version_code }})
          tracks: internal
          status: completed

      - name: Remove upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/android-play.keystore" "$RUNNER_TEMP/google-services.json"

      - name: Write release summary
        if: always()
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          VERSION_CODE: ${{ steps.plan.outputs.version_code }}
          SOURCE_COMMIT: ${{ steps.plan.outputs.source_commit }}
        run: |
          {
            echo "## Ait Google Play Android"
            echo "- Build: GitHub Actions / Gradle"
            echo "- Package: dev.ait.mobile"
            echo "- Version: $VERSION ($VERSION_CODE)"
            echo "- Source: $SOURCE_COMMIT"
            echo "- Workflow result: ${{ job.status }}"
            echo "- AAB artifact: android-play-aab"
            echo "- Internal testing: https://play.google.com/console"
          } >> "$GITHUB_STEP_SUMMARY"

  # ADR-235: Xcode Cloud archives the stable tag and distributes it to internal TestFlight.
  # This only starts the build. Cloud can only build refs, so source_commit rebuilds skip it.
  ios-testflight:
    name: Start iOS internal TestFlight build
    if: ${{ !contains(inputs.tag || github.ref_name, '-') && !inputs.source_commit }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Xcode Cloud only compares native and package versions, so check the tag here.
      - name: Check out release source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Check out release tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .tmp/release-tools
          persist-credentials: false

      - *setup-node
      - *verify-version

      - name: Start Xcode Cloud TestFlight build
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: node .tmp/release-tools/scripts/xcode-cloud-release.mjs "$RELEASE_TAG"

  # ADR-236: once Play accepts the bundle, attach Google's signed universal APK to the draft Release.
  # Rerunning only this job retries the APK without rebuilding or resubmitting to Play.
  android-apk:
    name: Attach Google-signed Android APK
    needs: [android-play, release]
    if: needs.android-play.outputs.submitted == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.android-play.outputs.version }}
      VERSION_CODE: ${{ needs.android-play.outputs.version_code }}
    steps:
      - name: Check out release tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .tmp/release-tools
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download Google-signed universal APK
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | grep -v -- -rc | sort -V | tail -n 1)
          node .tmp/release-tools/scripts/android-play-apk.mjs --version "$VERSION" \
            --version-code "$VERSION_CODE" --build-tools "$build_tools" --output-dir apk

      - name: Attach APK and refresh checksums
        run: |
          set -euo pipefail
          apk="Ait-${RELEASE_TAG#v}-android.apk"
          test -s "apk/$apk"
          draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$draft" != true ]; then
            echo "::warning::$RELEASE_TAG is already published; the APK was not attached"
            exit 0
          fi
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir sums
          {
            awk -v name="$apk" '$2 != name' sums/SHA256SUMS
            (cd apk && sha256sum "$apk")
          } | LC_ALL=C sort -k2,2 > SHA256SUMS
          gh release upload "$RELEASE_TAG" "apk/$apk" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

  release:
    name: Prepare GitHub Release
    needs: [build, windows]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - *checkout-source
      - *checkout-tooling
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v7
        with:
          pattern: ait-*
          path: release-assets
          merge-multiple: true

      - name: Record release build source
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { writeFileSync } = require('node:fs');
          const info = {
            version: process.env.RELEASE_TAG.replace(/^v/, ''),
            releaseTag: process.env.RELEASE_TAG,
            sourceCommit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            workflowCommit: process.env.GITHUB_WORKFLOW_SHA,
            workflowRunUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          };
          writeFileSync('release-assets/BUILD-INFO.json', JSON.stringify(info, null, 2) + '\n');
          NODE

      # Reruns keep an APK attached earlier; fetch only it and the checksums that cover it.
      - name: Preserve previously published Android APK
        run: |
          apk="Ait-${RELEASE_TAG#v}-android.apk"
          if test -f "release-assets/$apk"; then
            exit 0
          fi
          names=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name') || exit 0
          if grep -qxF "$apk" <<<"$names"; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$apk" --pattern SHA256SUMS --dir previous-assets
            (cd previous-assets && sha256sum --check --ignore-missing SHA256SUMS)
            cp "previous-assets/$apk" release-assets/
          fi

      - name: Verify assets and write checksums
        run: |
          args=(--daemon --windows)
          if test -f "release-assets/Ait-${RELEASE_TAG#v}-android.apk"; then
            args+=(--android)
          fi
          node .tmp/release-tools/scripts/release-assets.mjs verify \
            "${RELEASE_TAG#v}" release-assets "${args[@]}"

      - name: Create or repair GitHub Release
        shell: bash
        run: |
          release_flags=()
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "${#release_flags[@]}" -gt 0 ]; then
              gh release edit "$RELEASE_TAG" "${release_flags[@]}" --repo "$GITHUB_REPOSITORY"
            fi
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --draft \
              --generate-notes \
              --title "Ait ${RELEASE_TAG}" \
              --verify-tag \
              "${release_flags[@]}" \
              --repo "$GITHUB_REPOSITORY"
          fi
