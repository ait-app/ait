name: Publish AUR packages

# ait-bin runs only for a published stable release (or a manual run); a tag push alone is too early,
# as the release is still a draft without public assets. ait-git is maintained by hand.
# The full build runs upstream npm/Cargo code, so it never sees the AUR key. Publishing runs on a
# separate runner without building, and only the `aur` environment (main and v* tags) holds the key.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag for ait-bin (default latest release)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ait-bin
    if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && github.event.release.tag_name != 'nightly') }}
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 120
    concurrency:
      group: aur-build-ait-bin
      cancel-in-progress: false
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git github-cli namcap

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Prepare build user
        run: |
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder: "$GITHUB_WORKSPACE"

      # Resolved once so publishing uses the version that was built, even if a newer release appears.
      - name: Resolve release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          tag=${RELEASE_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}
          test -n "$tag"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build ait-bin
        env:
          AIT_VERSION: ${{ steps.release.outputs.version }}
        run: sudo -u builder -H bash scripts/aur-publish.sh build ait-bin "$AIT_VERSION"

  publish:
    name: Publish ait-bin
    needs: build
    runs-on: ubuntu-24.04
    container: archlinux:base
    timeout-minutes: 30
    environment: aur
    concurrency:
      group: aur-publish-ait-bin
      cancel-in-progress: false
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed base-devel git openssh

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Prepare publish user
        run: |
          useradd --create-home builder
          chown -R builder: "$GITHUB_WORKSPACE"

      - name: Configure AUR SSH
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "Set AUR_SSH_PRIVATE_KEY in the aur environment." >&2
            exit 1
          fi
          ssh=/home/builder/.ssh
          install -d -m 700 -o builder -g builder "$ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh/aur"
          # Published on https://aur.archlinux.org (SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4).
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > "$ssh/known_hosts"
          printf '%s\n' 'Host aur.archlinux.org' '  User aur' '  IdentityFile ~/.ssh/aur' '  IdentitiesOnly yes' > "$ssh/config"
          chown builder: "$ssh/aur" "$ssh/known_hosts" "$ssh/config"
          chmod 600 "$ssh/aur" "$ssh/known_hosts" "$ssh/config"

      - name: Publish ait-bin
        env:
          AIT_VERSION: ${{ needs.build.outputs.version }}
        run: |
          sudo -u builder -H env AUR_PUSH=1 GITHUB_SHA="$GITHUB_SHA" \
            bash scripts/aur-publish.sh publish ait-bin "$AIT_VERSION"
