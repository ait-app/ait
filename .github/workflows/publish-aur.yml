name: Publish AUR packages

# Stable binary packages only. The two Git recipes are built and published locally.
# Build jobs never receive the AUR key; publishing uses a separate runner and environment.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: Binary packages to publish
        required: true
        default: all
        type: choice
        options: [all, ait-bin, aitd-bin]
      tag:
        description: Stable release tag (default latest release)
        required: false
        type: string

permissions:
  contents: read

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && github.event.release.tag_name != 'dev') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      packages: ${{ steps.release.outputs.packages }}
    steps:
      - name: Resolve release once for all builds and publications
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          AUR_PACKAGE: ${{ inputs.package || 'all' }}
        shell: bash
        run: |
          tag=${RELEASE_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}
          version=${tag#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$AUR_PACKAGE" in
            all) echo 'packages=["ait-bin","aitd-bin"]' >> "$GITHUB_OUTPUT" ;;
            ait-bin|aitd-bin) printf 'packages=["%s"]\n' "$AUR_PACKAGE" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

  build:
    name: Build ${{ matrix.package }}
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.release.outputs.packages) }}
    concurrency:
      group: aur-build-${{ matrix.package }}
      cancel-in-progress: false
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git namcap
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build package
        env:
          AIT_VERSION: ${{ needs.release.outputs.version }}
          AUR_PACKAGE: ${{ matrix.package }}
        run: |
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder: "$GITHUB_WORKSPACE"
          sudo -u builder -H bash scripts/aur-publish.sh build "$AUR_PACKAGE" "$AIT_VERSION"

  publish:
    name: Publish ${{ matrix.package }}
    needs: [release, build]
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 30
    environment: aur
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.release.outputs.packages) }}
    concurrency:
      group: aur-publish-${{ matrix.package }}
      cancel-in-progress: false
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed base-devel git openssh
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure AUR SSH
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          useradd --create-home builder
          chown -R builder: "$GITHUB_WORKSPACE"
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "Set AUR_SSH_PRIVATE_KEY in the aur environment." >&2
            exit 1
          fi
          ssh=/home/builder/.ssh
          install -d -m 700 -o builder -g builder "$ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh/aur"
          # Published on https://aur.archlinux.org (SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4).
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > "$ssh/known_hosts"
          printf '%s\n' 'Host aur.archlinux.org' '  User aur' '  IdentityFile ~/.ssh/aur' '  IdentitiesOnly yes' > "$ssh/config"
          chown builder: "$ssh/aur" "$ssh/known_hosts" "$ssh/config"
          chmod 600 "$ssh/aur" "$ssh/known_hosts" "$ssh/config"

      - name: Publish package
        env:
          AIT_VERSION: ${{ needs.release.outputs.version }}
          AUR_PACKAGE: ${{ matrix.package }}
        run: |
          sudo -u builder -H env AUR_PUSH=1 GITHUB_SHA="$GITHUB_SHA" \
            AUR_GIT_NAME='Ait Release Bot' \
            AUR_GIT_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            bash scripts/aur-publish.sh publish "$AUR_PACKAGE" "$AIT_VERSION"
