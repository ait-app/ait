name: Release iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag with a published GitHub Release (vX.Y.Z)
        required: true
        type: string
      build_id:
        description: Optional finished EAS build ID to submit without rebuilding
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  testflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: ios-testflight
    timeout-minutes: 150
    env:
      TAG: ${{ inputs.tag }}
      BUILD_ID_INPUT: ${{ inputs.build_id }}
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Check out release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .tmp/release-tools

      - name: Verify checked out tag
        run: test "$(git rev-parse HEAD)" = "$(git rev-list -n1 "refs/tags/$TAG")"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Verify release version
        run: node scripts/verify-release-version.mjs "$TAG"

      - name: Load Ait EAS project identity
        run: |
          node <<'NODE'
          const { readFileSync, appendFileSync } = require('node:fs');
          const config = JSON.parse(readFileSync('apps/mobile/eas.json', 'utf8'));
          const publicIdentity = config.build.ait.env;
          for (const key of ['EXPO_OWNER', 'EXPO_SLUG', 'EAS_PROJECT_ID', 'IOS_BUNDLE_IDENTIFIER', 'APPLE_TEAM_ID']) {
            const value = publicIdentity[key];
            if (typeof value !== 'string' || !/^[A-Za-z0-9._-]+$/.test(value)) {
              throw new Error(`Invalid public Ait EAS identity: ${key}`);
            }
            appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          NODE

      - name: Require published GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)
          test "$(node -e 'process.stdout.write(String(!JSON.parse(process.argv[1]).isDraft && !JSON.parse(process.argv[1]).isPrerelease))' "$release")" = true

      - name: Plan TestFlight release
        id: plan
        run: node .tmp/release-tools/scripts/ios-testflight-release.mjs plan --tag "$TAG" --package-json apps/mobile/package.json

      - name: Check for duplicate EAS build
        if: env.BUILD_ID_INPUT == ''
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_NUMBER: ${{ steps.plan.outputs.ios_build_number }}
        run: |
          npx --no-install eas build:list --platform ios --build-profile ait \
            --app-identifier com.necokeine.ait --app-build-version "$BUILD_NUMBER" \
            --limit 50 --json --non-interactive > "$RUNNER_TEMP/existing-builds.json"
          node "$GITHUB_WORKSPACE/.tmp/release-tools/scripts/ios-testflight-release.mjs" \
            check-duplicates --build-number "$BUILD_NUMBER" --builds-json "$RUNNER_TEMP/existing-builds.json"

      - name: Start EAS build
        id: build
        if: env.BUILD_ID_INPUT == ''
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_NUMBER: ${{ steps.plan.outputs.ios_build_number }}
        run: |
          npx --no-install eas build --platform ios --profile ait --non-interactive \
            --freeze-credentials --no-wait --json > "$RUNNER_TEMP/build.json"
          if ! build_id=$(node "$GITHUB_WORKSPACE/.tmp/release-tools/scripts/ios-testflight-release.mjs" \
            build-id --stdout-file "$RUNNER_TEMP/build.json"); then
            for status in in-queue in-progress; do
              npx --no-install eas build:list --platform ios --build-profile ait \
                --app-identifier com.necokeine.ait --app-build-version "$BUILD_NUMBER" \
                --status "$status" --limit 50 --json --non-interactive > "$RUNNER_TEMP/recovered-builds.json"
              if build_id=$(node "$GITHUB_WORKSPACE/.tmp/release-tools/scripts/ios-testflight-release.mjs" \
                build-id --stdout-file "$RUNNER_TEMP/recovered-builds.json" 2>/dev/null); then
                break
              fi
            done
          fi
          test -n "$build_id"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Select existing EAS build
        id: existing
        if: env.BUILD_ID_INPUT != ''
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID_INPUT: ${{ inputs.build_id }}
          APP_VERSION: ${{ steps.plan.outputs.app_version }}
          BUILD_NUMBER: ${{ steps.plan.outputs.ios_build_number }}
        run: |
          npx --no-install eas build:view "$BUILD_ID_INPUT" --json > "$RUNNER_TEMP/build-view.json"
          node "$GITHUB_WORKSPACE/.tmp/release-tools/scripts/ios-testflight-release.mjs" \
            validate-build-id --view-json "$RUNNER_TEMP/build-view.json" \
            --build-number "$BUILD_NUMBER" --app-version "$APP_VERSION" --build-id "$BUILD_ID_INPUT"
          echo "build_id=$BUILD_ID_INPUT" >> "$GITHUB_OUTPUT"

      - name: Wait for EAS build
        if: env.BUILD_ID_INPUT == ''
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ steps.build.outputs.build_id }}
        run: |
          failures=0
          for attempt in $(seq 1 180); do
            rm -f "$RUNNER_TEMP/build-view.json"
            if npx --no-install eas build:view "$BUILD_ID" --json > "$RUNNER_TEMP/build-view.json" 2>/dev/null \
              && status=$(node "$GITHUB_WORKSPACE/.tmp/release-tools/scripts/ios-testflight-release.mjs" \
                status --view-json "$RUNNER_TEMP/build-view.json" 2>/dev/null); then
              failures=0
              case "$status" in
                done) exit 0 ;;
                failed) exit 1 ;;
              esac
            else
              failures=$((failures + 1))
              if test "$failures" -ge 5; then
                echo "Unable to read EAS build status after 5 consecutive attempts" >&2
                exit 1
              fi
            fi
            sleep 30
          done
          echo "EAS build did not finish within 90 minutes" >&2
          exit 1

      - name: Submit build to TestFlight
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ steps.build.outputs.build_id || steps.existing.outputs.build_id }}
        run: npx --no-install eas submit --platform ios --profile ait --id "$BUILD_ID" --non-interactive --wait

      - name: Write release summary
        if: always()
        env:
          BUILD_ID: ${{ steps.build.outputs.build_id || steps.existing.outputs.build_id || inputs.build_id }}
          APP_VERSION: ${{ steps.plan.outputs.app_version }}
          BUILD_NUMBER: ${{ steps.plan.outputs.ios_build_number }}
        run: |
          {
            echo "## Ait iOS TestFlight"
            echo "- Tag: $TAG"
            echo "- App version: $APP_VERSION"
            echo "- Build number: $BUILD_NUMBER"
            echo "- EAS build: $BUILD_ID"
            echo "- Build details: https://expo.dev/accounts/$EXPO_OWNER/projects/$EXPO_SLUG/builds/$BUILD_ID"
            echo "- App Store review: not submitted (manual in App Store Connect)"
          } >> "$GITHUB_STEP_SUMMARY"
