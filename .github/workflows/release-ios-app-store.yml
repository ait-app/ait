name: Release iOS to App Store
run-name: Release iOS to App Store · ${{ inputs.tag || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable source tag (vX.Y.Z); blank uses the selected branch commit"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-ios-app-store
  cancel-in-progress: false

jobs:
  release:
    name: Trigger Xcode Cloud and confirm start
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      checks: read
    steps:
      - name: Validate source tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$RELEASE_TAG" && ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::tag must be a stable vX.Y.Z tag, or empty.'
            exit 1
          fi
      - name: Check out workflow tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - name: Check out release source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          path: source
          # Used only to push the trigger tag; no source scripts or dependencies run here.
          persist-credentials: true
      - name: Trigger Xcode Cloud and confirm start
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const { release } = require('./tooling/scripts/ios-app-store-release.cjs');
            await release({ github, context, core, source: './source' });
