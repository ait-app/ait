name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish a test prerelease or add an APK to an existing stable release
        required: true
        default: test
        type: choice
        options: [test, release]
      tag:
        description: Existing stable tag (vX.Y.Z); required for release mode
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-android-${{ inputs.mode }}-${{ inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve Android release source
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      source_commit: ${{ steps.plan.outputs.source_commit }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
    env:
      MODE: ${{ inputs.mode }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate release request
        run: |
          case "$MODE" in
            test) test -z "$TAG" ;;
            release)
              test "$GITHUB_REF" = refs/heads/main
              [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
              ;;
            *) exit 1 ;;
          esac

      - name: Check out release source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.mode == 'release' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      - name: Plan Android release
        id: plan
        run: |
          export SOURCE_COMMIT=$(git rev-parse HEAD)
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { planAndroidRelease } from './scripts/android-release.mjs';
          const { version } = JSON.parse(readFileSync('apps/mobile/package.json', 'utf8'));
          const tag = process.env.MODE === 'release' ? process.env.TAG : `v${version}`;
          planAndroidRelease(tag, version);
          const sourceCommit = process.env.SOURCE_COMMIT;
          const releaseTag = process.env.MODE === 'test'
            ? `android-test-${tag}-${sourceCommit.slice(0, 12)}` : tag;
          appendFileSync(process.env.GITHUB_OUTPUT,
            `tag=${tag}\nsource_commit=${sourceCommit}\nrelease_tag=${releaseTag}\n`);
          NODE

      - name: Require published stable release
        if: inputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)
          test "$(node -e 'const release = JSON.parse(process.argv[1]); process.stdout.write(String(!release.isDraft && !release.isPrerelease))' "$release")" = true

  build:
    name: Build Android APK with Expo EAS
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      APP_VARIANT: production
      ANDROID_BUILD_TOOLS_VERSION: 36.0.0
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    steps:
      - name: Check out release source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify release version
        run: node scripts/verify-release-version.mjs "$RELEASE_TAG"

      - name: Install workspace dependencies
        run: npm ci

      - name: Load Ait EAS project identity
        run: |
          node <<'NODE'
          const { readFileSync, appendFileSync } = require('node:fs');
          const config = JSON.parse(readFileSync('apps/mobile/eas.json', 'utf8'));
          const publicIdentity = config.build.ait.env;
          for (const key of ['EXPO_OWNER', 'EXPO_SLUG', 'EAS_PROJECT_ID']) {
            const value = publicIdentity[key];
            if (typeof value !== 'string' || !/^[A-Za-z0-9._-]+$/.test(value)) {
              throw new Error(`Invalid public Ait EAS identity: ${key}`);
            }
            appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          NODE

      - name: Build APK with EAS
        working-directory: apps/mobile
        timeout-minutes: 120
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --no-install eas build --platform android --profile production-apk \
            --non-interactive --freeze-credentials --wait --json > "$RUNNER_TEMP/android-build.json"

      # Keep release tooling outside the source archive uploaded to EAS.
      - name: Check out release tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .tmp/release-tools
          persist-credentials: false

      - name: Validate EAS build
        id: build
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { planAndroidRelease, androidBuildArtifact } from './.tmp/release-tools/scripts/android-release.mjs';
          const pkg = JSON.parse(readFileSync('apps/mobile/package.json', 'utf8'));
          const builds = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/android-build.json`, 'utf8'));
          const { id, url } = androidBuildArtifact(builds, planAndroidRelease(process.env.RELEASE_TAG, pkg.version));
          appendFileSync(process.env.GITHUB_OUTPUT, `build_id=${id}\nartifact_url=${url}\n`);
          NODE

      - name: Download APK
        env:
          ARTIFACT_URL: ${{ steps.build.outputs.artifact_url }}
        run: |
          mkdir -p "$RUNNER_TEMP/android-apks"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
            "$ARTIFACT_URL" --output "$RUNNER_TEMP/android-apks/app-release.apk"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install APK verification tools
        run: sdkmanager "build-tools;$ANDROID_BUILD_TOOLS_VERSION"

      - name: Verify and collect APK
        run: |
          node .tmp/release-tools/scripts/android-release.mjs \
            --tag "$RELEASE_TAG" --package-json apps/mobile/package.json \
            --source-dir "$RUNNER_TEMP/android-apks" \
            --build-tools "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION" \
            --output-dir release-assets

      - uses: actions/upload-artifact@v6
        with:
          name: ait-android-apk
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Write build summary
        if: always()
        env:
          BUILD_ID: ${{ steps.build.outputs.build_id }}
        run: |
          {
            echo "## Ait Android APK"
            echo "- Tag: $RELEASE_TAG"
            echo "- EAS profile: production-apk"
            echo "- EAS build: $BUILD_ID"
            if [ -n "$BUILD_ID" ]; then
              echo "- Build details: https://expo.dev/accounts/$EXPO_OWNER/projects/$EXPO_SLUG/builds/$BUILD_ID"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish Android APK
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      MODE: ${{ inputs.mode }}
      VERSION_TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false
      - name: Check out release tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .tmp/release-tools
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v7
        with:
          name: ait-android-apk
          path: release-assets

      - name: Verify assets and record test build
        if: env.MODE == 'test'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readdirSync, statSync, writeFileSync } from 'node:fs';
          import { releaseAssetNames } from './.tmp/release-tools/scripts/release-assets.mjs';
          const version = process.env.VERSION_TAG.slice(1);
          const names = releaseAssetNames('android', version);
          assert.deepEqual(readdirSync('release-assets').sort(), [...names].sort());
          for (const name of names) {
            const file = statSync(`release-assets/${name}`);
            assert(file.isFile() && file.size > 0, `Empty or invalid APK: ${name}`);
          }
          const info = {
            version,
            releaseTag: process.env.RELEASE_TAG,
            sourceCommit: process.env.SOURCE_COMMIT,
            workflowCommit: process.env.GITHUB_WORKFLOW_SHA,
            workflowRunUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            signing: 'eas-managed',
          };
          writeFileSync('release-assets/BUILD-INFO.json', JSON.stringify(info, null, 2) + '\n');
          NODE

      - name: Write test APK checksums
        if: env.MODE == 'test'
        working-directory: release-assets
        run: sha256sum ./*.apk BUILD-INFO.json > SHA256SUMS

      - name: Create or update test prerelease
        if: env.MODE == 'test'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease --jq '(.isDraft == false) and (.isPrerelease == true)')" = true
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$SOURCE_COMMIT"
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$SOURCE_COMMIT" \
              --title "Ait Android test $VERSION_TAG (${SOURCE_COMMIT:0:12})" \
              --notes "Test APK built from $SOURCE_COMMIT with the existing EAS production-apk profile." \
              --prerelease --latest=false \
              --repo "$GITHUB_REPOSITORY"
          fi
          echo "Test APK: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Download and verify stable release assets
        if: env.MODE == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p stable-assets
          gh release download "$RELEASE_TAG" --dir stable-assets --repo "$GITHUB_REPOSITORY"
          (cd stable-assets && sha256sum --check SHA256SUMS)
          test -f "release-assets/Ait-${VERSION_TAG#v}-android.apk"
          cp "release-assets/Ait-${VERSION_TAG#v}-android.apk" stable-assets/
          node .tmp/release-tools/scripts/release-assets.mjs verify \
            "${VERSION_TAG#v}" stable-assets --android

      - name: Add APK to stable release
        if: env.MODE == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "stable-assets/Ait-${VERSION_TAG#v}-android.apk" stable-assets/SHA256SUMS \
            --clobber --repo "$GITHUB_REPOSITORY"
          echo "Stable APK: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
