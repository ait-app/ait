name: Release Android APK

on:
  workflow_call:
    inputs:
      tag:
        description: Stable release tag (vX.Y.Z)
        required: true
        type: string
      source_commit:
        description: Optional full commit SHA for an explicitly requested same-version rebuild
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      APP_VARIANT: production
      ANDROID_BUILD_TOOLS_VERSION: 36.0.0
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    steps:
      - name: Validate release inputs
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [ -n "$SOURCE_COMMIT" ]; then
            [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          fi

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || format('refs/tags/{0}', inputs.tag) }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify release version
        run: node scripts/verify-release-version.mjs "$RELEASE_TAG"

      - name: Install workspace dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;$ANDROID_BUILD_TOOLS_VERSION" "ndk;27.1.12297006" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build shared UI dependencies
        run: npm run build:ui-deps

      - name: Build terminal WebView bundle
        run: npm run build:terminal-webview --workspace=@ait/mobile

      - name: Generate production Android project
        working-directory: apps/mobile
        run: npx --no-install expo prebuild --platform android --clean --no-install

      - name: Configure APK architectures
        working-directory: apps/mobile/android
        run: |
          cat >> app/build.gradle <<'GRADLE'

          android {
              splits {
                  abi {
                      enable true
                      reset()
                      include 'arm64-v8a', 'armeabi-v7a'
                      universalApk false
                  }
              }
          }
          GRADLE

      # Temporarily retain the generated project's debug keystore; no release signing secrets.
      - name: Assemble release APKs
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      # Keep a second workspace copy out of Metro's module scan during the build.
      - name: Check out release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .tmp/release-tools
          persist-credentials: false

      - name: Verify and collect APKs
        run: |
          node .tmp/release-tools/scripts/android-release.mjs \
            --tag "$RELEASE_TAG" --package-json apps/mobile/package.json \
            --source-dir apps/mobile/android/app/build/outputs/apk/release \
            --build-tools "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION" \
            --output-dir release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: ait-android-apk
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
