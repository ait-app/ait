name: Mirror Release to COS

# Runs when a reviewed draft becomes a published release, so an unreviewed draft never
# becomes the COS "latest" download. Publishing with GITHUB_TOKEN does not trigger it;
# use workflow_dispatch to mirror such a release or to retry a failed run.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag to mirror (for example v0.1.8)
        required: true
        type: string

permissions:
  contents: read

# Serialize mirrors so two releases cannot interleave their latest object updates.
concurrency:
  group: release-mirror-cos
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror ${{ inputs.tag || github.event.release.tag_name }}
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      COS_BUCKET: ait-release-1251719274
      COS_REGION: ap-shanghai
    steps:
      - name: Check release state
        id: release
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Only stable vX.Y.Z releases are mirrored: $RELEASE_TAG"; exit 1; }
          state=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')
          [ "$state" = "false false" ] || { echo "::error::$RELEASE_TAG is a draft or prerelease"; exit 1; }
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$latest" = "$RELEASE_TAG" ]; then
            echo "args=--latest" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$latest is GitHub's latest release; only versioned objects of $RELEASE_TAG are mirrored"
          fi

      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/release-cos

      - name: Install and test mirror tooling
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -q -r scripts/release-cos/requirements.txt
          .venv/bin/python -m unittest discover -s scripts/release-cos

      - name: Download release assets
        run: |
          version="${RELEASE_TAG#v}"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir mirror-assets \
            --pattern "Ait-${version}-macos-arm64.dmg" \
            --pattern "Ait-${version}-daemon-*.tar.gz" \
            --pattern SHA256SUMS

      - name: Mirror to COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          .venv/bin/python scripts/release-cos/mirror.py "${RELEASE_TAG#v}" mirror-assets ${{ steps.release.outputs.args }} | tee mirror.json
          {
            echo '### COS mirror'
            echo '```json'
            cat mirror.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
