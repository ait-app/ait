name: Release Android Test APK

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: release-android-test-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve current commit
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      source_commit: ${{ steps.version.outputs.source_commit }}
      test_tag: ${{ steps.version.outputs.test_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Plan test release
        id: version
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { planAndroidRelease } from './scripts/android-release.mjs';
          const { version } = JSON.parse(readFileSync('apps/mobile/package.json', 'utf8'));
          const { version: checkedVersion } = planAndroidRelease(`v${version}`, version);
          const commit = process.env.GITHUB_SHA;
          if (!/^[0-9a-f]{40}$/.test(commit)) throw new Error('Expected a full commit SHA');
          appendFileSync(process.env.GITHUB_OUTPUT,
            `tag=v${checkedVersion}\nsource_commit=${commit}\ntest_tag=android-test-v${checkedVersion}-${commit.slice(0, 12)}\n`);
          NODE

  apk:
    name: Build test APKs
    needs: prepare
    uses: ./.github/workflows/release-android.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      source_commit: ${{ needs.prepare.outputs.source_commit }}

  publish:
    name: Publish Android prerelease
    needs: [prepare, apk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION_TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      TEST_TAG: ${{ needs.prepare.outputs.test_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v7
        with:
          name: ait-android-apk
          path: release-assets

      - name: Verify assets and record test build
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readdirSync, statSync, writeFileSync } from 'node:fs';
          import { releaseAssetNames } from './scripts/release-assets.mjs';
          const version = process.env.VERSION_TAG.slice(1);
          const names = releaseAssetNames('android', version);
          assert.deepEqual(readdirSync('release-assets').sort(), [...names].sort());
          for (const name of names) {
            const file = statSync(`release-assets/${name}`);
            assert(file.isFile() && file.size > 0, `Empty or invalid APK: ${name}`);
          }
          const info = {
            version,
            releaseTag: process.env.TEST_TAG,
            sourceCommit: process.env.SOURCE_COMMIT,
            workflowCommit: process.env.GITHUB_WORKFLOW_SHA,
            workflowRunUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            signing: 'debug',
          };
          writeFileSync('release-assets/BUILD-INFO.json', JSON.stringify(info, null, 2) + '\n');
          NODE

      - name: Write APK checksums
        working-directory: release-assets
        run: sha256sum ./*.apk BUILD-INFO.json > SHA256SUMS

      - name: Create or update test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TEST_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$TEST_TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease --jq '(.isDraft == false) and (.isPrerelease == true)')" = true
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TEST_TAG" --jq .sha)" = "$SOURCE_COMMIT"
            gh release upload "$TEST_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TEST_TAG" release-assets/* \
              --target "$SOURCE_COMMIT" \
              --title "Ait Android test $VERSION_TAG (${SOURCE_COMMIT:0:12})" \
              --notes "Test APKs built from $SOURCE_COMMIT using the default test signing key." \
              --prerelease --latest=false \
              --repo "$GITHUB_REPOSITORY"
          fi
          echo "Test APKs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TEST_TAG" >> "$GITHUB_STEP_SUMMARY"
