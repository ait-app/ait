name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'push'
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # PRs use their full diff; main pushes use the previous branch tip.
          base: ${{ github.ref }}
          filters: |
            rust:
              - 'bins/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'rustfmt.toml'
              - '.rustfmt.toml'
              - 'clippy.toml'
              - '.clippy.toml'
              - '.github/workflows/ci.yml'
            ui:
              - 'apps/**'
              - 'packages/**'
              - 'scripts/**'
              - 'patches/**'
              - 'assets/**'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - 'tsconfig.base.json'
              - '.oxfmtrc.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/release-ios-testflight.yml'
              - '.github/workflows/release-android.yml'

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Source moves can break documentation links even without Markdown edits.
      # These scripts use only Node built-ins and do not need npm ci.
      - run: node --test scripts/check-docs.test.mjs
      - run: node scripts/check-docs.mjs

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Match rust-toolchain.toml so new stable lints cannot silently break this job.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run verify:local-packages
      - run: npm run verify:release
      - run: npm run test:release
      - run: npm run test:mobile-release
      - run: npm run build:desktop-main
      - run: npm run test --workspace=@ait/mobile -- src/components/question-form-card-core.test.ts
      - run: npm run test --workspace=@ait/protocol
      - run: npm run test --workspace=@ait/mobile -- src/runtime/host-runtime.test.ts
      - run: npm run typecheck --workspace=@ait/desktop --workspace=@ait/mobile
      - run: npm test --workspace=@ait/desktop
      - run: >-
          npm run test --workspace=@ait/mobile --
          src/i18n/resources.test.ts src/runtime/rust-daemon maestro/support native-release-version.test.ts
          src/timeline src/types/stream.test.ts src/runtime/replica-cache
