name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'push'
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # PRs use their full diff; main pushes use the previous branch tip.
          base: ${{ github.ref }}
          filters: |
            rust:
              - 'bins/**'
              - 'crates/**'
              - 'scripts/fixtures/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'rustfmt.toml'
              - '.rustfmt.toml'
              - 'clippy.toml'
              - '.clippy.toml'
              - '.config/nextest.toml'
              - '.github/workflows/ci.yml'
            ui:
              - 'apps/**'
              - 'packages/**'
              - 'scripts/**'
              - 'patches/**'
              - 'assets/**'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - 'tsconfig.base.json'
              - '.oxfmtrc.json'
              - 'crates/provider/tests/fixtures/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/cancel-merged-pr-ci.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/release-ios-testflight.yml'
              - '.github/workflows/release-android.yml'
              - '.github/workflows/release-android-play.yml'

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Source moves can break documentation links even without Markdown edits.
      # These scripts use only Node built-ins and do not need npm ci.
      - run: node --test scripts/check-docs.test.mjs
      - run: node scripts/check-docs.mjs

  # Formatting covers Markdown, workflows and TOML as well as code, so it runs on every change.
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Run the pinned formatter directly instead of installing the full workspace.
      - run: npx --yes "oxfmt@$(node -p 'require("./package.json").devDependencies.oxfmt')" --check .

  headless-macos:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      # rust-cache prunes non-Cargo files under target, leaving empty prebuilt lib directories.
      # sherpa checks only whether lib/ exists; reset both its build record and partial download.
      - name: Reset cached sherpa native artifacts
        run: |
          cargo clean --package sherpa-onnx-sys
          rm -rf target/sherpa-onnx-prebuilt
      - run: "cargo test --locked -p daemon --bin daemon device::"
      - run: "cargo test --locked -p daemon --bin daemon config::"
      - run: cargo test --locked -p daemon --bin daemon host::tests::headless
      - run: cargo test --locked -p host-link

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # Match rust-toolchain.toml so new stable lints cannot silently break this job.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      # rust-cache prunes non-Cargo files under target, leaving empty prebuilt lib directories.
      # sherpa checks only whether lib/ exists; reset both its build record and partial download.
      - name: Reset cached sherpa native artifacts
        run: |
          cargo clean --package sherpa-onnx-sys
          rm -rf target/sherpa-onnx-prebuilt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --all --check
      # --locked keeps a stale Cargo.lock from passing here and failing only at release time.
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo nextest run --locked --workspace --profile ci
      # nextest does not execute doctests.
      - run: cargo test --locked --workspace --doc
      # ADR-094: client method names must match the Rust component declarations.
      - run: python3 scripts/check-paseo-client-methods.py
      - run: python3 scripts/rust_method_specs_test.py
      - run: python3 scripts/check-crate-coverage.test.py

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx oxlint
      - run: node --test scripts/check-ui.test.mjs
      # Formatting is already checked repository-wide by the format job.
      - name: Check changed UI lint
        env:
          UI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:ui -- "$UI_DIFF_BASE"
      - run: npm run verify:local-packages
      - run: npm run verify:release
      - run: npm run test:release
      - run: npm run test:mobile-release
      - run: npm run build:desktop-main
      - run: npm run test --workspace=@ait/mobile -- src/components/question-form-card-core.test.ts
      - run: npm run test --workspace=@ait/protocol
      - run: npm run test --workspace=@ait/client
      - run: npm run test --workspace=@ait/mobile -- src/runtime/host-runtime.test.ts
      - run: npm run typecheck --workspace=@ait/desktop --workspace=@ait/mobile
      - run: npm test --workspace=@ait/desktop
      - run: npm run test:sdk
      - run: npm run test --workspace=@ait/highlight
      - run: >-
          npm run test --workspace=@ait/mobile --
          src/i18n/resources.test.ts src/runtime/rust-daemon maestro/support native-release-version.test.ts
          src/timeline src/types/stream.test.ts src/runtime/replica-cache
          src/runtime/directory-sync src/screens/workspace/workspace-route-state.test.ts
