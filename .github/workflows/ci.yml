name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ui: ${{ steps.filter.outputs.ui }}
      web_client: ${{ steps.filter.outputs.web_client }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'push'
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # PRs use their full diff; main pushes use the previous branch tip.
          base: ${{ github.ref }}
          filters: |
            rust:
              - 'bins/**'
              - 'crates/**'
              - 'scripts/fixtures/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'rustfmt.toml'
              - '.rustfmt.toml'
              - 'clippy.toml'
              - '.clippy.toml'
              - '.config/nextest.toml'
              - '.github/workflows/ci.yml'
            ui:
              - 'apps/**'
              - 'packages/**'
              - 'scripts/**'
              - 'patches/**'
              - 'assets/**'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - 'tsconfig.base.json'
              - '.oxfmtrc.json'
              - 'crates/provider/tests/fixtures/**'
              - '.github/workflows/**'
            web_client:
              - 'apps/mobile/**'
              - 'packages/**'
              - 'patches/**'
              - 'assets/**'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - 'tsconfig.base.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'

  # Formatting and doc links span the whole repository, so they run on every change.
  # Neither needs npm ci: the docs check uses Node built-ins and the formatter is pinned.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check docs
        run: npm run check:docs
      - name: Check formatting
        run: npx --yes "oxfmt@$(node -p 'require("./package.json").devDependencies.oxfmt')" --check .

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # Match rust-toolchain.toml so new stable lints cannot silently break this job.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # PRs restore main's cache without saving their own, which keeps main's entries warm.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # rust-cache prunes non-Cargo files under target, leaving empty prebuilt lib directories.
      # sherpa checks only whether lib/ exists; reset both its build record and partial download.
      - name: Reset cached sherpa native artifacts
        run: |
          cargo clean --package sherpa-onnx-sys
          rm -rf target/sherpa-onnx-prebuilt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Prepare Linux sandbox tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          # GitHub's disposable runner must permit the user namespaces exercised by these tests.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --disable-userns --ro-bind / / --proc /proc --dev /dev -- /bin/true
      # Static checks run first so they fail before the long compile.
      - name: Check formatting and method specs
        run: |
          cargo fmt --all --check
          # ADR-094: client method names must match the Rust component declarations.
          python3 scripts/check-paseo-client-methods.py
          python3 scripts/rust_method_specs_test.py
          python3 scripts/check-crate-coverage.test.py
      # --locked keeps a stale Cargo.lock from passing here and failing only at release time.
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo nextest run --locked --workspace --profile ci
      # nextest does not execute doctests.
      - run: cargo test --locked --workspace --doc

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - &setup-node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Formatting is already checked repository-wide by the lint job.
      - name: Lint changed UI
        env:
          UI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          npx oxlint
          node --test scripts/check-ui.test.mjs
          npm run check:ui -- "$UI_DIFF_BASE"
      - name: Verify packages and release tooling
        run: |
          npm run verify:local-packages
          npm run verify:release
          npm run test:release
          npm run test:mobile-release
      # Also builds the SDK and highlight packages that the tests below import.
      - run: npm run build:desktop-main
      - run: npm run typecheck --workspace=@ait/desktop --workspace=@ait/mobile
      - run: npm run test --workspace=@ait/protocol --workspace=@ait/client --workspace=@ait/highlight
      - run: npm test --workspace=@ait/desktop
      - run: >-
          npm run test --workspace=@ait/mobile --
          src/components/question-form-card-core.test.ts src/runtime/host-runtime.test.ts
          src/i18n/resources.test.ts src/runtime/daemon-transport maestro/support native-release-version.test.ts
          src/timeline src/types/stream.test.ts src/runtime/replica-cache
          src/runtime/directory-sync src/screens/workspace/workspace-route-state.test.ts
          src/runtime/online-service-host-sync.test.ts src/screens/settings/online-service-host-section.test.tsx
          src/utils/tool-call-parsers.test.ts src/utils/diff-highlight.test.ts
          src/voice/audio-engine.native.test.ts src/voice/audio-engine.web.test.ts src/voice/voice-runtime.test.ts

  # ADR-188: the hosted browser client ships as a static image at the site root.
  web-client:
    needs: changes
    if: needs.changes.outputs.web_client == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - *setup-node
      - run: npm ci
      - run: npm run build:web-console --workspace=@ait/mobile
      - run: docker build --tag ait-web-client:ci apps/mobile/web-console
      - name: Check image routes
        run: |
          docker run --rm --detach --name ait-web-client --publish 127.0.0.1:8080:80 ait-web-client:ci
          bash apps/mobile/web-console/check-routes.sh http://127.0.0.1:8080

  # The browser client against a real daemon, so either side of the protocol can break it.
  web-client-e2e:
    needs: changes
    if: needs.changes.outputs.web_client == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - *setup-node
      - run: npm ci
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # See the rust job: rust-cache leaves empty prebuilt sherpa directories behind.
      - name: Reset cached sherpa native artifacts
        run: |
          cargo clean --package sherpa-onnx-sys
          rm -rf target/sherpa-onnx-prebuilt
      - run: cargo build --locked -p daemon --bin daemon
      - run: npx playwright install --with-deps chromium
      - name: Run web client smoke test
        env:
          E2E_AIT_SERVER_BIN: ${{ github.workspace }}/target/debug/daemon
          # A selected root survives worker teardown, which keeps server.log for the next step.
          E2E_AIT_DATA_ROOT: ${{ runner.temp }}/ait-e2e
        run: npm run test:e2e:smoke --workspace=@ait/mobile
      # CI never uploads artifacts, so the daemon's side of a failure goes to the job log.
      - name: Show daemon log
        if: failure()
        run: tail -n 500 "$RUNNER_TEMP"/ait-e2e/*/server.log || true
