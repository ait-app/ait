name: Nightly Build

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: Ignore reruns of superseded commits
        id: head
        uses: actions/github-script@v8
        with:
          script: |
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'dev' });
            core.setOutput('current', String(branch.commit.sha === context.sha));

  build:
    needs: prepare
    if: needs.prepare.outputs.current == 'true'
    # New commits replace obsolete builds without interrupting a release upload.
    concurrency:
      group: nightly-dev-build-${{ matrix.platform }}
      cancel-in-progress: true
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
          - label: Apple Silicon
            runner: macos-15
            rust_target: aarch64-apple-darwin
            platform: mac
            arch: arm64
    env:
      CARGO_TERM_COLOR: always
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      AIT_DESKTOP_SMOKE: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.rust_target }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate release tooling and version
        run: |
          npm run test:release
          npm run verify:release
      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse2 xvfb libgtk-3-0 libnss3 libasound2t64
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Build daemon
        run: cargo build --locked --release -p daemon --bin daemon --target "${{ matrix.rust_target }}"
      - name: Build desktop
        env:
          AIT_SERVER_BIN: ${{ github.workspace }}/target/${{ matrix.rust_target }}/release/daemon
        run: |
          npm run build:desktop-assets
          (cd apps/desktop && node scripts/prepare-daemon.mjs && npm run build:main)
      - name: Package nightly desktop
        working-directory: apps/desktop
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          args=()
          if [ "$PLATFORM" = mac ]; then
            args+=(-c.mac.identity=- -c.mac.notarize=false)
          fi
          npm exec -- electron-builder --config electron-builder.yml \
            "--$PLATFORM" "--$ARCH" --publish never \
            -c.publish.owner="${GITHUB_REPOSITORY_OWNER}" \
            -c.publish.repo="${GITHUB_REPOSITORY#*/}" "${args[@]}"
      - name: Collect assets
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          version=$(node -p 'require("./package.json").version')
          node scripts/release-assets.mjs collect "$PLATFORM" "$version" apps/desktop/release release-assets
      - uses: actions/upload-artifact@v6
        with:
          name: nightly-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # Serialize the tag/release replacement; never cancel a partial upload.
    concurrency:
      group: nightly-dev-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v7
        with:
          pattern: nightly-*
          path: release-assets
          merge-multiple: true
      - name: Verify assets and record source
        run: |
          version=$(node -p 'require("./package.json").version')
          node scripts/release-assets.mjs verify "$version" release-assets
          node <<'NODE'
          const { writeFileSync } = require('node:fs');
          const info = {
            version: require('./package.json').version,
            releaseTag: 'nightly',
            sourceCommit: process.env.GITHUB_SHA,
            workflowRunUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            macSigning: 'ad-hoc, not notarized',
          };
          writeFileSync('release-assets/BUILD-INFO.json', JSON.stringify(info, null, 2) + '\n');
          NODE
          (cd release-assets && sha256sum BUILD-INFO.json >> SHA256SUMS)
      - name: Replace previous nightly release and move tag
        id: release
        uses: actions/github-script@v8
        with:
          script: |
            const repo = context.repo;
            const { data: branch } = await github.rest.repos.getBranch({ ...repo, branch: 'dev' });
            if (branch.commit.sha !== context.sha) {
              core.notice('A newer dev commit exists; skip publishing this build.');
              core.setOutput('publish', 'false');
              return;
            }
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({ ...repo, tag: 'nightly' });
              await github.rest.repos.deleteRelease({ ...repo, release_id: release.id });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              await github.rest.git.getRef({ ...repo, ref: 'tags/nightly' });
              await github.rest.git.updateRef({ ...repo, ref: 'tags/nightly', sha: context.sha, force: true });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ ...repo, ref: 'refs/tags/nightly', sha: context.sha });
            }
            core.setOutput('publish', 'true');
      - name: Publish latest nightly
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create nightly release-assets/* --verify-tag --target "$GITHUB_SHA" \
            --title 'Ait Nightly' --prerelease --latest=false \
            --notes "Development build from $GITHUB_SHA. Replaced on the next successful dev build. macOS is ad-hoc signed and not notarized." \
            --repo "$GITHUB_REPOSITORY"
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/nightly" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Remove temporary nightly artifacts
    needs: [build, publish]
    if: ${{ always() && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: context.runId, per_page: 100,
            });
            for (const artifact of artifacts) {
              if (['nightly-linux', 'nightly-mac'].includes(artifact.name)) {
                await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id: artifact.id });
              }
            }
