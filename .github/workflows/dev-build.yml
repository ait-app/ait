name: Dev build

# Run manually on main to publish its current commit as the rolling `dev` prerelease once
# CI has passed on that commit. CI itself never packages desktops or publishes releases.
on:
  workflow_dispatch:

permissions:
  contents: read

# A later trigger waits for the running dev build instead of interrupting its upload.
concurrency:
  group: dev-build
  cancel-in-progress: false

jobs:
  prepare:
    # Manual runs from other branches never publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Covers waiting for a CI run that is still in progress on this commit.
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.admit.outputs.publish }}
      label: ${{ steps.identity.outputs.label }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Resolve dev build identity
        id: identity
        run: node scripts/dev-build.mjs identity
      - name: Require passing CI on this commit
        id: admit
        uses: actions/github-script@v8
        with:
          script: |
            const { admit } = require('./scripts/dev-build-control.cjs');
            core.setOutput('publish', String(await admit({ github, context, core })));

  desktop:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    name: Desktop ${{ matrix.label }}
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
          - label: Apple Silicon
            runner: macos-15
            rust_target: aarch64-apple-darwin
            platform: mac
            arch: arm64
    env:
      CARGO_TERM_COLOR: always
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      AIT_DESKTOP_SMOKE: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      DEV_BUILD_LABEL: ${{ needs.prepare.outputs.label }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Linux compiles the daemon inside the manylinux container, which installs its own toolchain.
      - uses: dtolnay/rust-toolchain@1.98.1
        if: matrix.platform == 'mac'
        with:
          targets: ${{ matrix.rust_target }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Release tooling tests run in the ui job whenever scripts or workflows change.
      - run: npm run verify:release
      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse2 xvfb libgtk-3-0 libnss3 libasound2t64 rpm
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Set dev build runtime version
        run: |
          version=$(node --input-type=module -e 'import { devDisplayVersion } from "./scripts/dev-build.mjs"; console.log(devDisplayVersion(process.env.DEV_BUILD_LABEL))')
          echo "AIT_BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_AIT_BUILD_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build daemon
        if: matrix.platform == 'mac'
        run: cargo build --locked --release -p daemon --bin daemon --target "${{ matrix.rust_target }}"
      # Match release builds: the runner's glibc 2.39 would lock dev builds out of older distributions.
      - name: Build daemon (glibc 2.28 baseline)
        if: matrix.platform == 'linux'
        run: bash scripts/build-linux-daemon.sh daemon daemon "${{ matrix.rust_target }}" 1.98.1
      - name: Build desktop
        env:
          AIT_SERVER_BIN: ${{ github.workspace }}/target/${{ matrix.rust_target }}/release/daemon
        run: |
          npm run build:desktop-assets
          (cd apps/desktop && node scripts/prepare-daemon.mjs && npm run build:main)
      - name: Package desktop preview
        working-directory: apps/desktop
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          args=()
          if [ "$PLATFORM" = mac ]; then
            args+=(-c.mac.identity=- -c.mac.notarize=false)
          fi
          dev_args=$(node ../../scripts/dev-build.mjs builder-args "$DEV_BUILD_LABEL")
          while IFS= read -r arg; do args+=("$arg"); done <<< "$dev_args"
          npm exec -- electron-builder --config electron-builder.yml \
            "--$PLATFORM" "--$ARCH" --publish never \
            -c.publish.owner="${GITHUB_REPOSITORY_OWNER}" \
            -c.publish.repo="${GITHUB_REPOSITORY#*/}" "${args[@]}"
      - name: Collect assets
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          version=$(node -p 'require("./package.json").version')
          node scripts/release-assets.mjs collect "$PLATFORM" "$version" apps/desktop/release release-assets --dev "$DEV_BUILD_LABEL"
      # Same binary as the desktop bundle. macOS keeps the linker's ad-hoc signature and is not notarized.
      - name: Package standalone daemon
        env:
          PLATFORM: ${{ matrix.platform }}
          DAEMON_BIN: ${{ github.workspace }}/target/${{ matrix.rust_target }}/release/daemon
        run: |
          if [ "$PLATFORM" = mac ]; then codesign --verify --verbose "$DAEMON_BIN"; fi
          version=$(node -p 'require("./package.json").version')
          node scripts/release-assets.mjs daemon "$PLATFORM" "$version" "$DAEMON_BIN" release-assets --dev "$DEV_BUILD_LABEL"
      # Restrict user namespaces so the installed packages must fall back to their SUID helper.
      - name: Smoke installed deb and rpm packages
        if: matrix.platform == 'linux'
        working-directory: apps/desktop
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          sudo apt-get install -y ./release/*.deb
          node e2e/linux-artifact-smoke.js
          sudo dpkg --remove ait-desktop
          # Ubuntu names runtime libraries the Debian way; rpm still installs the real payload and scriptlets.
          sudo rpm --install --nodeps release/*.rpm
          node e2e/linux-artifact-smoke.js
      - uses: actions/upload-artifact@v6
        with:
          name: dev-${{ needs.prepare.outputs.label }}-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish:
    needs: [prepare, desktop]
    if: needs.prepare.outputs.publish == 'true'
    env:
      DEV_BUILD_LABEL: ${{ needs.prepare.outputs.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v7
        with:
          pattern: dev-*
          path: release-assets
          merge-multiple: true
      - name: Verify assets and record source
        run: |
          version=$(node -p 'require("./package.json").version')
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { devPackagedVersion } from './scripts/dev-build.mjs';
          const info = {
            version: process.env.DEV_BUILD_LABEL,
            packagedVersion: devPackagedVersion(process.env.DEV_BUILD_LABEL),
            releaseTag: 'dev',
            sourceCommit: process.env.GITHUB_SHA,
            workflowCommit: process.env.GITHUB_SHA,
            workflowRunNumber: Number(process.env.GITHUB_RUN_NUMBER),
            workflowRunUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            macSigning: 'ad-hoc, not notarized',
          };
          writeFileSync('release-assets/BUILD-INFO.json', JSON.stringify(info, null, 2) + '\n');
          NODE
          node scripts/release-assets.mjs verify "$version" release-assets --dev "$DEV_BUILD_LABEL"
      - name: Move tag and remove previous dev release
        uses: actions/github-script@v8
        with:
          script: |
            const { moveTag } = require('./scripts/dev-build-control.cjs');
            // The tag moves first: a refused ref update must not delete the live release.
            await moveTag({ github, context, core });
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag: 'dev' });
              await github.rest.repos.deleteRelease({ ...context.repo, release_id: release.id });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
      - name: Publish latest dev build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create dev release-assets/* --verify-tag --target "$GITHUB_SHA" \
            --title "Ait Dev $DEV_BUILD_LABEL" --prerelease --latest=false \
            --notes "Development build from $GITHUB_SHA. Replaced by the next manually published dev build. macOS is ad-hoc signed and not notarized. If macOS blocks the standalone aitd after a browser download, run \`xattr -d com.apple.quarantine aitd\` in the extracted folder." \
            --repo "$GITHUB_REPOSITORY"
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/dev" >> "$GITHUB_STEP_SUMMARY"
      # Runs only after every step above succeeds, so a failed publish keeps both platforms'
      # artifacts for "Re-run failed jobs". A cleanup error must not fail the job and invite a
      # rerun that would republish an already live dev build; the artifacts expire after a day.
      - name: Remove temporary dev build artifacts
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: context.runId, per_page: 100,
            });
            for (const artifact of artifacts) {
              if (/^dev-(?:[0-9a-f]{8}-\d{4}-\d{2}-\d{2}-)?(?:linux|mac)$/.test(artifact.name)) {
                await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id: artifact.id });
              }
            }
