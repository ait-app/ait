npmRebuild: false
appId: dev.ait.desktop
productName: Ait
copyright: "Copyright © 2026 Necokeine"
executableName: Ait
extraMetadata:
  name: "@ait/desktop"
protocols:
  - name: Ait agent link
    schemes:
      - ait
afterPack: ./scripts/after-pack.js
afterSign: ./scripts/after-sign.js
directories:
  output: release
files:
  - dist/**/*
  - "!**/*.map"
  - "!node_modules/@ait/*/src/**"
  - "!node_modules/@ait/**/*.test.*"
  - "!node_modules/@ait/**/*.spec.*"
  # Workspace packages are symlinked, so anything a dev generates inside them
  # lands in the asar. CI never has these; a local .debug run adds gigabytes.
  - "!node_modules/@ait/*/.debug/**"
  - "!node_modules/@ait/*/.tasks/**"
  - "!node_modules/@ait/*/conversations/**"
  - "!node_modules/@ait/*/test-results/**"
extraResources:
  - from: assets/icon.png
    to: icon.png
  - from: ../mobile/dist
    to: app-dist
  - from: assets/editor-targets
    to: editor-target-icons
publish:
  provider: github
  owner: ait-app
  repo: ait
  channel: "${channel}"
mac:
  extraResources:
    - from: release-resources/daemon/daemon
      to: bin/daemon
  publish:
    provider: generic
    url: https://aitapp.cn/api/v1/updates/macos/
    channel: "${channel}"
    # COS supports single-range requests; differential downloads use repeated requests.
    useMultipleRangeRequest: false
  artifactName: "Ait-${version}-macos-${arch}.${ext}"
  minimumSystemVersion: "13.0.0"
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  hardenedRuntime: true
  notarize: true
  binaries:
    - Contents/Resources/bin/daemon
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  target:
    - dmg
    - zip
linux:
  extraResources:
    - from: release-resources/daemon/daemon
      to: bin/daemon
  category: Development
  icon: assets
  artifactName: "Ait-${version}-linux-${arch}.${ext}"
  # Debian requires a contact address; the name matches the macOS copyright holder.
  maintainer: "Necokeine <necokeine@gmail.com>"
  vendor: "Ait"
  synopsis: "Ait desktop app"
  target:
    - AppImage
    - tar.gz
    - deb
    - rpm
win:
  icon: assets/icon.ico
  artifactName: "Ait-${version}-windows-${arch}.${ext}"
  target:
    - nsis
    - zip
nsis:
  artifactName: "Ait-${version}-windows-${arch}-setup.${ext}"
# Native packages install a root-owned SUID chrome-sandbox and an AppArmor profile,
# so the sandbox survives distributions that restrict unprivileged user namespaces.
# Builder's default dependency lists omit ALSA and GBM, which Electron links at startup.
# The removal hook replaces builder's default, which also ran on rpm upgrades.
deb:
  packageName: ait-desktop
  afterInstall: scripts/linux-sandbox/after-install.tpl
  afterRemove: scripts/linux-sandbox/after-remove.tpl
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    # Name the real library first: apt otherwise may satisfy the virtual libasound2
    # with liboss4-salsa-asound2, which lacks symbols Electron needs.
    - libasound2t64 | libasound2
rpm:
  packageName: ait-desktop
  afterInstall: scripts/linux-sandbox/after-install.tpl
  afterRemove: scripts/linux-sandbox/after-remove.tpl
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - (libXtst or libXtst6)
    - xdg-utils
    - at-spi2-core
    - (libuuid or libuuid1)
    - (alsa-lib or libasound2)
    - (mesa-libgbm or libgbm1)
appImage:
  # A nonempty argument list replaces builder's hardcoded --no-sandbox default.
  executableArgs: ["--class=Ait"]
  # Stable filenames let electron-updater replace the installed AppImage in place.
  artifactName: "Ait-linux-${arch}.${ext}"
