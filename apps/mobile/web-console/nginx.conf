# Hosted browser client at the site root (ADR-188). The ait-server gateway on the
# same origin owns /api, /dash and the sign-in pages; this server never proxies.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
        application/manifest+json application/wasm image/svg+xml font/ttf;

    # add_header is not inherited once a location sets its own, so each block repeats it.
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # The gateway owns the API; a request reaching this image was misrouted.
    location ~ ^/api(?:/|$) {
        return 404;
    }

    # Content-hashed bundles and assets: a missing file is an error, never the HTML shell.
    # Cache-Control omits "always" so a 404 during a rolling deploy is not cached for a year.
    location ^~ /_expo/static/ {
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /assets/ {
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page export: client routes such as /settings or /h/... load index.html.
    # Unhashed files (index.html, manifest, icons, client-build.json) revalidate every time.
    location / {
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
