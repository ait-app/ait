<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#181B1A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ait" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* Keep the app shell fixed to the viewport. */
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* These styles smooth text rendering in the app shell. */
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Prevent white flash before React mounts */
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #181b1a;
        }
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        width: 100%;
        height: 100%;
        flex: 1;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
    </style>
    <style>
      /* Electron can subtract no-drag bounds even when a scroll viewport clips
         them. Keep chat/content controls out of this rule: scrolling them behind
         a titlebar must not erase its drag region. Only chrome and floating
         controls need exclusions. Do not mark full-viewport portal hosts no-drag. */
      :where(
          :has(> [data-titlebar-drag-region]),
          [data-testid="desktop-window-controls"],
          #overlay-root,
          [data-floating-panel-host]
        )
        :is(
          button,
          a,
          input,
          textarea,
          select,
          [role="button"],
          [role="link"],
          [role="textbox"],
          [role="combobox"],
          [role="tab"],
          [role="switch"],
          [role="checkbox"],
          [role="slider"],
          [role="menuitem"],
          [tabindex],
          [contenteditable="true"]
        ) {
        -webkit-app-region: no-drag !important;
      }

      /* On macOS the sidebar toggle floats beside the traffic lights, outside
         the header that owns the drag region. Exclude the button itself. */
      #menu-button {
        -webkit-app-region: no-drag !important;
      }

      /* React Native Web Modal portals live outside #overlay-root. Exclude the
         temporary modal surface so workspace drag regions cannot swallow its
         pointer events, including the backdrop and controls. */
      [aria-modal="true"] {
        -webkit-app-region: no-drag !important;
      }

      /* Suppress the browser's default focus outline — it appears on mouse
         clicks and looks out of place against our themed surfaces. Keep a
         themed ring for keyboard users via :focus-visible. */
      *:focus {
        outline: none;
      }
      *:focus-visible {
        outline: 2px solid #20744a;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
