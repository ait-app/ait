[package]
name = "relay"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
futures-util.workspace = true
futures-util.features = ["io"]
model.workspace = true
reqwest.workspace = true
reqwest.features = ["rustls-tls", "stream"]
rustls.workspace = true
secrecy.workspace = true
secrecy.features = ["serde"]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-tungstenite.features = ["rustls-tls-webpki-roots"]
tokio-util.workspace = true
tokio-util.features = ["compat"]
# Reliable multiplexed byte streams carried inside standard WSS binary messages.
yamux = "=0.14.1"
tracing.workspace = true
url.workspace = true
uuid.workspace = true
uuid.features = ["serde"]
webpki-roots.workspace = true

[dev-dependencies]
# Advance relay deadlines deterministically in local transport fixtures.
tokio.workspace = true
tokio.features = ["test-util"]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
