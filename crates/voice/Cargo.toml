[package]
name = "voice"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Shared envelopes and connection runtime; no dependency on transport or Agent implementation.
model.workspace = true

base64.workspace = true
reqwest.workspace = true
reqwest.features = ["json", "multipart", "rustls-tls", "stream"]
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
# Safe Rust API with bundled static native inference libraries.
sherpa-onnx.workspace = true
# Bounded extraction of official model releases into the private speech cache.
bzip2.workspace = true
tar.workspace = true
# Report model preparation without exposing audio, transcripts or credentials.
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
axum.workspace = true
tokio.workspace = true
tokio.features = ["net", "rt-multi-thread", "test-util"]
