[package]
name = "voice"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Shared envelopes and connection runtime; no dependency on transport or Agent implementation.
model = { version = "0.0.16", path = "../model" }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
uuid = { version = "1.26.0", features = ["v4"] }
# Safe Rust API with bundled static native inference libraries.
sherpa-onnx = "=1.13.8"
# Bounded extraction of official model releases into the private speech cache.
bzip2 = "0.6"
tar = "0.4"
# Report model preparation without exposing audio, transcripts or credentials.
tracing = "0.1"

[lints]
workspace = true

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["net", "rt-multi-thread", "test-util"] }
