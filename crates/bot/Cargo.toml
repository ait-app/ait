[package]
name = "bot"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Bot owns orchestration; Provider owns native sessions and durable input admission.
domain.workspace = true
model.workspace = true
provider.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
# Direct outbound channel transports; no webhook server or remote state service.
reqwest.workspace = true
reqwest.features = ["rustls-tls", "json"]
futures-util.workspace = true
tokio-tungstenite.workspace = true
tokio-tungstenite.features = ["rustls-tls-webpki-roots"]
url.workspace = true
# Feishu's documented protobuf WebSocket frame; no code generator or SDK runtime.
prost.workspace = true
async-trait.workspace = true

[dev-dependencies]
persistence.workspace = true
tempfile.workspace = true
axum.workspace = true

[lints]
workspace = true
