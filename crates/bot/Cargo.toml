[package]
name = "bot"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Bot owns orchestration; Provider owns native sessions and durable input admission.
domain.workspace = true
model.workspace = true
provider.workspace = true
# Instruction delivery mode of the Bot session port.
provider-core.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
# Direct outbound channel transports; no webhook server or remote state service.
reqwest.workspace = true
reqwest.features = ["rustls-tls", "json"]
futures-util.workspace = true
tokio-tungstenite.workspace = true
tokio-tungstenite.features = ["rustls-tls-webpki-roots"]
url.workspace = true
# Feishu's documented protobuf WebSocket frame; no code generator or SDK runtime.
prost.workspace = true
# Feishu scan-to-create encodes requested permissions as gzip and URL-safe base64.
base64.workspace = true
flate2.workspace = true
# QQ scan-to-create returns the new bot's secret sealed with AES-256-GCM.
ring.workspace = true
async-trait.workspace = true
# Telegram renders provider CommonMark through its restricted HTML parse mode.
pulldown-cmark.workspace = true

[dev-dependencies]
persistence.workspace = true
tempfile.workspace = true
axum.workspace = true

[lints]
workspace = true
