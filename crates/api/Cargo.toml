[package]
name = "api"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
server-relay = { version = "0.0.14", path = "../server-relay" }
schedule = { version = "0.0.14", path = "../../crates/schedule" }
browser = { version = "0.0.14", path = "../../crates/browser" }
voice = { version = "0.0.14", path = "../voice" }
model = { version = "0.0.14", path = "../model" }
terminal = { version = "0.0.14", path = "../terminal" }
provider = { version = "0.0.14", path = "../provider" }
filesystem = { version = "0.0.14", path = "../filesystem" }
metadata = { version = "0.0.14", path = "../metadata" }
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
secrecy = "0.10.3"
serde = "1.0.229"
serde_json = "1.0.151"
protocol = { path = "../protocol" }
subtle = "2.6.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower-http = { version = "0.6", features = ["trace", "timeout"] }
tracing = "0.1.44"
uuid = { version = "1.26.0", features = ["v4"] }
# Shared UTC timestamp for phased Workspace retirement.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[lints]
workspace = true

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = "0.29"
