[package]
name = "provider"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
model.workspace = true
domain.workspace = true
metadata.workspace = true

# Internal OpenCode approval and progress sinks over the owned HTTP runtime.
async-trait.workspace = true
# Consume bounded native HTTP and event streams.
futures-util.workspace = true
# Authenticated DSH Host logical streams on an owned loopback WebSocket.
tokio-tungstenite.workspace = true
# Validate image payloads before native prompt admission and decode provider image artifacts.
base64.workspace = true
# Read-only Claude OAuth quota inspection; credentials never enter public snapshots.
reqwest.workspace = true
reqwest.features = ["rustls-tls", "json", "stream"]
secrecy.workspace = true
chrono.workspace = true
rusqlite.workspace = true
rusqlite.features = ["bundled", "backup"]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
# Estimate chat search hits from rendered Markdown blocks without an HTML renderer.
pulldown-cmark.workspace = true
# Match literal queries with Unicode case folding and flexible whitespace.
regex.workspace = true

[lints]
workspace = true

[dev-dependencies]
# Offline native HTTP fixtures, without provider credentials or a model API.
axum.workspace = true
tokio-stream.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Match Claude Agent SDK's NFC normalization of native session directory names.
unicode-normalization.workspace = true
