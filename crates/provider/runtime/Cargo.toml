[package]
name = "provider"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Ports and protocol values shared with the native adapters.
provider-core.workspace = true
model.workspace = true
domain.workspace = true
async-trait.workspace = true

# Consume bounded native event streams and concurrent session previews.
futures-util.workspace = true
secrecy.workspace = true
chrono.workspace = true
rusqlite.workspace = true
rusqlite.features = ["bundled", "backup"]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
# Estimate chat search hits from rendered Markdown blocks without an HTML renderer.
pulldown-cmark.workspace = true
# Match literal queries with Unicode case folding and flexible whitespace.
regex.workspace = true
# File-backed registries behind the `testing` execution worker; only `test-support` enables it.
persistence = { workspace = true, optional = true }

[features]
# Runtime test entry points for adapter crates' tests; never enabled by production dependents.
test-support = ["dep:persistence"]

[lints]
workspace = true

[dev-dependencies]
# The Codex app-server fake that drives the execution and manager suites.
provider-codex = { workspace = true, features = ["test-support"] }
persistence.workspace = true
# Encode image payloads in rich-input and inbox fixtures.
base64.workspace = true
# Virtual clock checks for provider-specific cold-start deadlines.
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
