[package]
name = "browser"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Shared independent-server envelopes only; business execution is supplied through ports.
model = { version = "0.0.15", path = "../model" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "sync", "time"] }
uuid = { version = "1.26.0", features = ["v4"] }

url = "2.5.8"
futures-util = "0.3.32"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util", "rt-multi-thread"] }
